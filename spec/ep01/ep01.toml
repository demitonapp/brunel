# --- shot list (8 x 9 s = 72 s) -----------------------------------------

[[shot]]
id = "s01"
name = "The Ferry Problem"
camera = "cam_river"
seconds = 9.0
narration = "By 1825 London's docks at Wapping and Rotherhithe faced each other across the river. The only road between them was the water, and it was crowded."

[[shot]]
id = "s02"
name = "The Shipworm"
camera = "cam_macro"
seconds = 9.0
narration = "Marc Brunel had spent years on the problem. He is said to have taken his answer from the shipworm, a mollusc that bores through submerged timber."

[[shot]]
id = "s03"
name = "The Shaft Sinks"
camera = "cam_shaft"
seconds = 9.0
narration = "First, a shaft. A fifty-foot iron ring with a brick wall above it and a steam engine on top. It sank under its own weight. When it jammed, they piled on fifty thousand bricks."

[[shot]]
id = "s04"
name = "The Board"
camera = "cam_board"
seconds = 9.0
narration = "The shield itself. Twelve frames, three levels, thirty-six cells. Cast iron, thirty-seven feet across, with one man to a cell."

[[shot]]
id = "s05"
name = "One Cell's Cycle"
camera = "cam_cell"
seconds = 9.0
narration = "A miner drew back his board and cut into the clay behind it. Then two screws, one at his head and one at his feet, pushed the cell forward against the finished brickwork."

[[shot]]
id = "s06"
name = "Miners Forward, Bricklayers Behind"
camera = "cam_face"
seconds = 9.0
narration = "Behind him the bricklayers were already building the permanent lining. The tunnel was assembled in place, ring by ring, at one to eight feet a week."

[[shot]]
id = "s07"
name = "The Flood, 12 January 1828"
camera = "cam_flood"
seconds = 9.0
narration = "It flooded twice. In January 1828 six men died. Isambard Kingdom Brunel, not yet twenty-one, was carried out unconscious."

[[shot]]
id = "s08"
name = "The Legacy"
camera = "cam_legacy"
seconds = 9.0
narration = "It opened in 1843. Since 1869 it has carried trains. Brunel's shield became every tunnel boring machine that came after it."

