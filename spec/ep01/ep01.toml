# Episode 1 - Marc Brunel's tunnelling shield, Thames Tunnel (1825-1843)
#
# 8 shots, 72 s, L0 quality. Deliberately flat.
#
#   Final target : 1080x1920 @ 30 fps on the Windows / RTX 3080 node
#   Mac preview  : --fast caps this to 480x854 @ 12 fps, which is ~65-90 min
#
# Track frames are NORMALISED to 0.0-1.0 of each shot, so the animation does
# not have to be re-timed when the preview profile changes.
#
# Every number that appears on screen is sourced in
# spec/ep01/facts/ep01.facts.json. The ledger is written BEFORE the script and
# `factgate --publish` gates the render.

[meta]
id = "ep01"
title = "The Shield - Brunel and the Thames Tunnel"
fps = 30
width = 1080
height = 1920
samples = 32
engine = "CYCLES"
device = "OPTIX"
units = "metric"

