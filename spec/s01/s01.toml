# --- the load demonstration ----------------------------------------------
# Draft 2 explained the mechanism and never showed a consequence. These two
# shots are the consequence, staged identically so the CUT does the comparing:
# the same cylinder at the same pressure lifts a block pushing, and half a
# block pulling.
#
# The pull rig is mounted INVERTED - cap up, rod down - because a cylinder
# pulls by retracting, so the only way to lift with it is to hang the load
# underneath. Getting that backwards would be a machine that cannot exist.

