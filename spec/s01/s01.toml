rot = [0.0, 64.0, 0.0]
shots = ["h07"]
smooth = 30.0
[part.params]
bore = 0.14
rod = 0.1
# rod, not barrel: at barrel length the tip sat off frame
length = 1.15
piston = 0.05
section = false
segments = 48

[[part]]
id = "b4_stick_barrel"
gen = "cylinder_body"
material = "steel"
loc = [ 0.10, 0.0,  0.00]
rot = [0.0, 70.0, 0.0]
shots = ["h07"]
smooth = 30.0
[part.params]
bore = 0.12
rod = 0.085
wall = 0.014
length = 1.2
section = false
segments = 48

[[part]]
id = "b4_stick_rod"
gen = "cylinder_rod"
material = "chrome"
loc = [ 0.10, 0.0,  0.00]
rot = [0.0, 70.0, 0.0]
shots = ["h07"]
smooth = 30.0
[part.params]
