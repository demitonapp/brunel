# s01 - "Why a hydraulic cylinder pushes harder than it pulls"
#
# Draft 3. Brief: brief.md  Script: script.md  Critique: critique.md
# Facts: facts/s01.facts.json - 140 x 100 at 350 bar, every input cited.
#
# Draft 2 rendered, verified and shipped 30 seconds whose subject occupied
# 1.9-2.4% of the frame, opened on a wide establishing shot, withheld for
# seven seconds and carried 240 wpm that `voice` refused. critique.md has the
# analysis. Four things in this file come from it and are not preference:
#
#   1. The cylinder is STOOD UP on the frame's long axis (rot y = 34). A 12:1
#      object lying near-horizontal cannot fill a 9:16 frame at any distance.
#   2. Fourteen shots, none over 3 s. Draft 2 ran six shots at 5.0 s average,
#      which is documentary pacing in a swipe feed.
#   3. The conclusion is stated in the first line, not withheld. 50-60% of all
#      drop-off happens in the first three seconds.
#   4. The numbers are `label` geometry in the scene. Draft 2 had none at all,
#      so the one number the brief says the viewer will repeat never appeared.

[meta]
id = "s01"
title = "Why a hydraulic cylinder pushes harder than it pulls"
fps = 30
width = 1080
height = 1920
# 16, not 32. Measured on this scene: 43.5 s/frame at 32, 24.5 at 16, and with
# denoising on 5,672 polys of simple shapes the difference is not visible - the
# gold callout and the chrome highlight are equally clean. 4.8 hours saved.
samples = 16
engine = "CYCLES"
device = "CPU"
units = "metric"
# 62 is the documentary default and 3.2% of frame height. A Short wants 5%.
caption_size = 96
caption_font = "IBM Plex Sans SemiBold"

# --- world ----------------------------------------------------------------
# A CC0 studio HDRI. Metal is made by what it REFLECTS, and every metal in this
# film had nothing to reflect but a flat colour - which is the shared cause of
# "the block looks rubbish" and "those circles look terrible". `visible = false`
# keeps the HDRI out of camera rays, so the frame keeps its dark brand field
# and the steel still has a room in it.
[world]
hdri = "assets/hdri/studio_small_09_2k.hdr"
strength = 0.55
visible = false

