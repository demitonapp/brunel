[[camera]]
id = "cam_hero"
lens_mm = 58.0
loc = [0.42, -1.52, 0.18]
look_at = [0.0, 0.0, 0.0]

[[camera]]
id = "cam_section"
lens_mm = 105.0
loc = [0.46, -1.02, 0.30]
look_at = [-0.20, 0.0, 0.0]

# H24. ortho_scale is the frame WIDTH in metres and is mutually exclusive with
# lens_mm. Without it b03b/b03c argue for whichever figure is nearer the lens.
# A drift, not a hold. check_motion fails a frozen shot - and it is right to,
# because a shot that never changes is usually a track that was written and
# never applied. These two ARE meant to be held, so they get the smallest move
# that is still a move.
#
# It costs nothing, and only an ORTHOGRAPHIC camera makes that true: ortho_scale
# fixes the frame width regardless of distance, so the camera can travel without
# altering the size of either figure. Under a lens the same drift would change
# the very areas the shot exists to compare.
[[camera]]
id = "cam_areas"
ortho_scale = 0.25
loc = [0.0, -1.20, 0.0]
look_at = [0.0, 0.0, 0.0]

[[camera]]
id = "cam_three"
lens_mm = 62.0
loc = [1.10, -2.20, 1.04]
look_at = [0.0, 0.0, 0.10]

# --- lights ---------------------------------------------------------------
# Probe finding: 420 W at ~2 m blew the frame out under AgX. These are the
# values that measured correctly, and `section_fill` exists because nothing
# else reaches the inside of the cut.

[[light]]
id = "key"
type = "AREA"
energy = 150.0
loc = [1.60, -2.00, 2.20]
look_at = [0.0, 0.0, 0.0]

[[light]]
id = "fill"
type = "AREA"
energy = 55.0
loc = [-2.40, -1.60, 0.50]
look_at = [0.0, 0.0, 0.0]

[[light]]
id = "section_fill"
type = "AREA"
energy = 38.0
loc = [-0.35, -0.85, 0.28]
look_at = [-0.35, 0.05, 0.0]
shots = ["h04"]

[[light]]
id = "rim"
type = "AREA"
energy = 70.0
loc = [-0.60, 1.90, 1.10]
look_at = [0.0, 0.0, 0.0]

# --- shots ----------------------------------------------------------------
# 5 + 7 + 4 + 3 + 4 + 7 = 30 s. Narration is copied from script.md; the script
# is the approved text and this file is downstream of it.

[[shot]]
id = "h01"
name = "The conclusion, stated"
camera = "cam_hero"
seconds = 4.0
narration = "A hydraulic cylinder pushes twice as hard as it pulls."

[[shot]]
id = "h02"
name = "The other number"
camera = "cam_hero"
seconds = 3.0
narration = "Fifty-five tonnes pushing. Twenty-seven pulling."

[[shot]]
id = "h03"
name = "Same oil, same pressure"
camera = "cam_hero"
seconds = 2.5
narration = "Same oil. Same pump. Same pressure."

[[shot]]
id = "h04"
name = "Inside"
camera = "cam_section"
seconds = 4.5
narration = "Force is pressure times area. The faces are not the same size."

[[shot]]
id = "h05"
name = "The ring"
camera = "cam_areas"
seconds = 4.0
move_from = [0.0, -1.20, 0.0]
move_to = [0.018, -1.20, -0.010]
narration = "The rod is in the way. What is left is a ring."

[[shot]]
id = "h06"
name = "The same size"
camera = "cam_areas"
seconds = 5.0
move_from = [0.0, -1.20, 0.0]
move_to = [-0.016, -1.20, 0.009]
narration = "It does not look like half. Gather it up: the same size."

[[shot]]
id = "h07"
name = "Three of them"
camera = "cam_three"
seconds = 7.0
narration = "That is why an excavator curls in hard and pushes out weak. Three on the arm. None pull their weight."

# --- beat 4 strokes ------------------------------------------------------
# One stroke each, staggered by the frames above so they do not pulse in
# unison. The vector differs per cylinder because a location track is in
# world space and each one sits at its own rot.

[[track]]
part = "b4_boom_rod"
channel = "location"
shots = ["h07"]
frames = [0.0, 0.30, 0.44, 0.80]
values = [[-0.780, 0.000, 0.600], [-0.313, 0.000, 0.828], [-0.313, 0.000, 0.828], [-0.780, 0.000, 0.600]]
[[track]]
part = "b4_stick_rod"
channel = "location"
shots = ["h07"]
frames = [0.10, 0.42, 0.56, 0.92]
values = [[0.100, 0.000, 0.000], [0.513, 0.000, 0.150], [0.513, 0.000, 0.150], [0.100, 0.000, 0.000]]
[[track]]
part = "b4_bucket_rod"
channel = "location"
shots = ["h07"]
frames = [0.22, 0.54, 0.68, 1.0]
values = [[0.860, 0.000, -0.560], [1.190, 0.000, -0.478], [1.190, 0.000, -0.478], [0.860, 0.000, -0.560]]
