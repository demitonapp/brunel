# s01 - "Why a hydraulic cylinder pushes harder than it pulls"
#
# Brief:  docs/videos/s01-hydraulic-cylinder/brief.md
# Script: docs/videos/s01-hydraulic-cylinder/script.md
# Facts:  spec/s01/facts/s01.facts.json   (140 x 100 at 350 bar, all sourced)
#
# Three things in this file were decided by a storyboard probe, not by taste.
#
#   1. The cylinder lies along X (rot = [0, 90, 0]) and the camera sits off-axis
#      and high. That is what makes a 9:1 object read diagonally in a 0.56:1
#      frame. Staged level it is a band across a fifth of the frame; the spec
#      has no camera roll, and it does not need one, because moving the camera
#      does the same job.
#
#   2. `section = true` cuts the -Y half away. Rotation about Y preserves Y, so
#      rot = [0, 90, 0] lays the barrel along X AND leaves the cut facing -Y,
#      which is where every camera in this cut stands.
#
#   3. Beat 3 does NOT show the piston's faces in the section. A side-on section
#      shows a face edge-on, as a line - it can never read as an area. The areas
#      are their own flat figures, shot orthographically, because an area
#      comparison under a perspective lens argues for whichever figure is nearer
#      (H24). And the ring alone does not read as half: measured on the probe it
#      reads as about a third, which is why b03c sets the ring's equal-area disc
#      (98.0 mm) beside the rod's circle (100.0 mm) instead of asserting it.

[meta]
id = "s01"
title = "Why a hydraulic cylinder pushes harder than it pulls"
fps = 30
width = 1080
height = 1920
samples = 32
engine = "CYCLES"
device = "CPU"
units = "metric"

# --- materials -----------------------------------------------------------
# Probe finding: steel at base_color 0.045 is black under AgX, and chrome at
# roughness 0.075 blows to white. Both are corrected here.

[[material]]
id = "steel"
base_color = [0.20, 0.215, 0.235]
roughness = 0.42
metallic = 1.0

[[material]]
id = "chrome"
base_color = [0.66, 0.675, 0.70]
roughness = 0.30
metallic = 1.0

[[material]]
id = "face"
base_color = [0.80, 0.58, 0.20]
roughness = 0.32
metallic = 0.6

[[material]]
id = "rodface"
base_color = [0.42, 0.52, 0.64]
roughness = 0.30
metallic = 0.8

# --- callouts -------------------------------------------------------------
# The brief: "the numbers are rendered as 3D-tracked callouts in the scene, not
# as caption text - a dimension that lives in the edit is a dimension nothing
# can check." The first cut shipped without them, so the one number the brief
# said the viewer would repeat never appeared on screen at all.
#
# Positions are fixed and the SHOTS decide which is visible, so h01 carries the
# push figure alone (upper left), h02 the pull figure alone (lower right), and
# h03 shows both at once against one unchanged object - which is the whole
# "same oil, same pressure" point, made in a single frame instead of seven
# seconds of withholding.

[[part]]
id = "callout_push"
gen = "label"
material = "face"
loc = [-0.40, -0.45, 0.60]
shots = ["h01", "h03"]
[part.params]
text = "55 t"
size = 0.20
extrude = 0.006

[[part]]
id = "callout_pull"
gen = "label"
material = "rodface"
loc = [0.42, -0.45, -0.60]
shots = ["h02", "h03"]
[part.params]
text = "27 t"
size = 0.20
extrude = 0.006


# --- the hero cylinder: beats 1, 2, 3a -----------------------------------

# Solid for the hook. The cut-away is beat 3's reveal, and a sectioned barrel
# in b01 gives it away twelve seconds early - so this is two parts, each
# visible in its own shots, not one part with a section flag.
[[part]]
id = "cyl_barrel"
gen = "cylinder_body"
material = "steel"
loc = [0.0, 0.0, 0.0]
rot = [0.0, 34.0, 0.0]
shots = ["h01", "h02", "h03"]
smooth = 30.0
[part.params]
bore = 0.140
rod = 0.100
wall = 0.015
length = 1.50
section = false
segments = 64

[[part]]
id = "cyl_barrel_cut"
gen = "cylinder_body"
material = "steel"
loc = [0.0, 0.0, 0.0]
rot = [0.0, 34.0, 0.0]
shots = ["h04"]
smooth = 30.0
[part.params]
bore = 0.140
rod = 0.100
wall = 0.015
length = 1.50
section = true
segments = 64

[[part]]
id = "cyl_rod"
gen = "cylinder_rod"
material = "chrome"
loc = [-0.196, 0.0, -0.290]
rot = [0.0, 34.0, 0.0]
shots = ["h01", "h02", "h03", "h04"]
smooth = 30.0
[part.params]
bore = 0.140
rod = 0.100
# 1.20, not the barrel's 1.50. The rod's only visible FEATURE is its tip, and
# at 1.50 the tip sat off-frame through the whole stroke - so the extension
# changed no pixel at all and check_motion correctly called the shot frozen.
length = 1.20
section = true
segments = 64
emit = "rod"

# The piston is its own part ONLY so it can carry its own material. In the
# first storyboard it inherited the rod's chrome and vanished against it, in
# the one shot whose whole subject is the piston's two faces.
[[part]]
id = "cyl_piston"
gen = "cylinder_rod"
material = "face"
loc = [-0.196, 0.0, -0.290]
rot = [0.0, 34.0, 0.0]
shots = ["h01", "h02", "h03", "h04"]
smooth = 30.0
[part.params]
bore = 0.140
rod = 0.100
piston = 0.06
section = true
segments = 64
emit = "piston"

# The stroke. There is no `extend` parameter - a [[track]] targets a part id,
# which is the whole reason the rod is its own part.
# The stroke. h01 drives out, h02 draws back, h03 holds at full extension so
# the two numbers can sit against one unmoving object, h04 creeps for life.
[[track]]
part = ["cyl_rod", "cyl_piston"]
channel = "location"
shots = ["h01"]
frames = [0.0, 0.72, 1.0]
values = [[-0.196, 0.0, -0.290], [0.084, 0.0, 0.124], [0.084, 0.0, 0.124]]

[[track]]
part = ["cyl_rod", "cyl_piston"]
channel = "location"
shots = ["h02"]
frames = [0.0, 0.70, 1.0]
values = [[0.084, 0.0, 0.124], [-0.196, 0.0, -0.290], [-0.196, 0.0, -0.290]]

[[track]]
part = ["cyl_rod", "cyl_piston"]
channel = "location"
shots = ["h03"]
frames = [0.0, 1.0]
values = [[-0.190, 0.0, -0.282], [-0.145, 0.0, -0.216]]

[[track]]
part = ["cyl_rod", "cyl_piston"]
channel = "location"
shots = ["h04"]
frames = [0.0, 1.0]
values = [[-0.212, 0.0, -0.315], [-0.045, 0.0, -0.066]]

# --- beat 3b: the whole face, and the ring left when the rod comes out ----

# THE RING - 140 outer, 100 inner. The first storyboard had a solid 140 disc
# here by mistake, so b03b showed two solid circles and said nothing: the shot
# whose narration is "what is left is a ring" had no ring in it.
[[part]]
id = "area_ring"
gen = "area_disc"
material = "face"
loc = [-0.058, 0.0, 0.0]
shots = ["h05"]
[part.params]
outer = 0.140
inner = 0.100

[[part]]
id = "area_plug"
gen = "area_disc"
material = "rodface"
loc = [0.058, 0.0, 0.0]
shots = ["h05", "h06"]
[part.params]
outer = 0.100
inner = 0.0

# --- beat 3c: the ring, re-formed. A CUT, not a morph - the harness has no
# shape interpolation, and the reveal is the comparison, not the tween.

[[part]]
id = "area_eq"
gen = "area_disc"
material = "face"
loc = [-0.058, 0.0, 0.0]
shots = ["h06"]
# 98.0 mm: the 75.40 cm2 annulus re-formed as a solid disc. Against the rod's
# 100.0 mm circle beside it, that is the video's whole claim, shown to scale.
[part.params]
outer = 0.098
inner = 0.0

